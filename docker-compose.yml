version: '3.8'

services:

  # ═══════════════════════════════════════════════
  # INFRASTRUCTURE SERVICES
  # ═══════════════════════════════════════════════

  postgres:
    image: postgres:15-alpine
    container_name: intellidocx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: intellidocx
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intellidocx"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: intellidocx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: intellidocx-elastic
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  minio:
    image: minio/minio
    container_name: intellidocx-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  ganache:
    image: trufflesuite/ganache:latest
    container_name: intellidocx-ganache
    restart: unless-stopped
    ports:
      - "8545:8545"
    command: ["--deterministic", "--accounts", "10", "--host", "0.0.0.0"]

  # ═══════════════════════════════════════════════
  # APPLICATION SERVICES
  # ═══════════════════════════════════════════════

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: intellidocx-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=intellidocx-documents
      - AI_SERVICE_API_KEY=intellidocx-ai-secret-key
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./ai-service:/app

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intellidocx-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - JWT_SECRET=intellidocx-secret-key-change-in-prod
      - JWT_ACCESS_SECRET=intellidocx-access-secret-change-in-prod
      - JWT_REFRESH_SECRET=intellidocx-refresh-secret-change-in-prod
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/intellidocx
      - DIRECT_URL=postgresql://postgres:password@postgres:5432/intellidocx
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=intellidocx-documents
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_SERVICE_API_KEY=intellidocx-ai-secret-key
      - BLOCKCHAIN_RPC_URL=http://ganache:8545
      - PRIVATE_KEY=0xf4c88568fb1acfdb09a2f8e4177a304bac829d15fae31c66a61e9ea368cbd83e
      - CONTRACT_ADDRESS=0xc3c56a7397b9c917fa545c4e6f375d41b24ecdc8
    # Run migrations, push schema, seed, then start dev server
    command: >
      sh -c "
        echo '⏳ Waiting for DB...' &&
        until nc -z postgres 5432; do sleep 1; done &&
        echo '✅ DB ready' &&
        npx prisma generate &&
        npx prisma db push --accept-data-loss &&
        npx ts-node prisma/seed.ts &&
        echo '🚀 Starting backend...' &&
        npm run dev
      "
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intellidocx-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      # Point to backend — must be reachable from the BROWSER, not Docker network
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  elastic_data:
  minio_data:
